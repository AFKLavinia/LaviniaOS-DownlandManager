[package]
name = "lodm-app"
version = "0.1.0"
description = "LODM — LaviniaOS Download Manager Desktop App"
authors = ["LaviniaOS Team"]
edition = "2021"

[lib]
name = "lodm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lavinia_download_core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
