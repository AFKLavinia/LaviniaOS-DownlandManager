[package]
name = "lavinia_download_core"
version = "0.1.0"
edition = "2021"
authors = ["LaviniaOS Team"]
description = "High-performance IDM-grade raw byte streaming multi-segment download manager engine"

[lib]
name = "lavinia_download_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lavinia_downloader"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
md-5 = "0.10"
bytes = "1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO"
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
